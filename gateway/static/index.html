<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sd_service test page</title>
<style>
  :root {
    --bg: #f7f5f0; --card: #fffdf8; --ink: #14213d; --muted: #5b6474; --line: #ddd8cc;
    --accent: #2f6fb0; --accent-ink: #ffffff;
    --queued: #ecead3; --running: #dceaf7; --success: #d8efdf; --review: #f6e3c9; --failed: #f6d6d3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11182a; --card: #1a2338; --ink: #eef1f6; --muted: #a3adbf; --line: #2c3753;
      --accent: #5b9be0; --accent-ink: #0d1424;
      --queued: #3a3a2c; --running: #213a57; --success: #1f4030; --review: #4a3a22; --failed: #4b2726;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .health { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px;
          padding: 4px 12px; font-size: 13px; color: var(--muted); }
  .pill b { color: var(--ink); font-weight: 600; }
  .pill.bad { border-color: #c2483d; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .wide { grid-column: 1 / -1; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg);
          border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  textarea { min-height: 72px; resize: vertical; }
  textarea.short { min-height: 40px; }
  .actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 18px;
           background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button.plain { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .6; cursor: default; }
  #message { font-size: 14px; }
  #message.err { color: #c2483d; }
  .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .list-head h2 { font-size: 17px; margin: 0; }
  .tasks { display: flex; flex-direction: column; gap: 12px; }
  .task-top { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .taskid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-left: auto; }
  .prompt { margin: 6px 0 0; color: var(--muted); overflow-wrap: anywhere; }
  .badge { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; color: var(--ink); }
  .b-queued { background: var(--queued); } .b-running { background: var(--running); }
  .b-success { background: var(--success); } .b-needs_review { background: var(--review); }
  .b-failed, .b-rejected, .b-not_found { background: var(--failed); }
  .error { color: #c2483d; margin: 6px 0 0; font-size: 14px; overflow-wrap: anywhere; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .thumb { display: block; text-decoration: none; color: var(--muted); font-size: 12px; }
  .thumb img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff;
               border: 1px solid var(--line); border-radius: 8px; display: block; }
  .thumb span { display: block; margin-top: 4px; }
  .empty { color: var(--muted); }
  .hint { margin: -4px 0 0; font-size: 13px; color: var(--muted); min-height: 1em; }
  .viewer { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
            background: rgba(10, 14, 24, .82); padding: 16px; }
  .viewer.open { display: flex; }
  .viewer figure { margin: 0; position: relative; background: var(--card); border-radius: 12px; padding: 12px;
                   max-width: min(92vw, 1048px); box-shadow: 0 20px 60px rgba(0, 0, 0, .4); }
  .viewer img { display: block; width: min(86vw, 82vh, 1024px); height: auto; aspect-ratio: 1;
                object-fit: contain; background: #fff; border-radius: 8px; }
  .viewer figcaption { margin-top: 8px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .viewer .close { position: absolute; top: -14px; right: -14px; width: 36px; height: 36px; padding: 0;
                   border-radius: 999px; font-size: 22px; line-height: 36px; background: var(--card);
                   color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
  .thumb { cursor: zoom-in; }
  @media (max-width: 640px) { form { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <h1>sd_service test page</h1>
  <p class="sub">Submit a prompt, watch the task, preview the images. Tasks run as Slurm GPU batches on Explorer, so expect a few minutes.</p>

  <div class="health" id="health"><span class="pill">health: loading…</span></div>

  <form id="form" class="card">
    <label class="wide">Prompt (at most 77 tokens, about 50 words)
      <textarea id="prompt" required>a shiny red apple with a green leaf, cute cartoon sticker, white background</textarea>
    </label>
    <label class="wide">Negative prompt (optional; added to the built-in safety terms, about 17 tokens left with sticker, 45 with none)
      <textarea id="negative" class="short" placeholder="e.g. green apple, worm"></textarea>
    </label>
    <label>Task ID <input id="taskid" required pattern="[A-Za-z0-9_-]{1,64}"></label>
    <label>Filename prefix <input id="prefix" placeholder="defaults to task ID" pattern="[A-Za-z0-9_-]{1,64}"></label>
    <label>Images
      <select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
    </label>
    <label>Style (LoRA)
      <select id="style"><option value="">none (plain SDXL)</option></select>
    </label>
    <p id="style-hint" class="hint wide"></p>
    <label>Postprocess
      <select id="postprocess"><option value="sticker">sticker</option><option value="none">none</option></select>
    </label>
    <label>If task ID exists
      <select id="dup"><option value="reject">reject</option><option value="replace">replace</option></select>
    </label>
    <div class="actions">
      <button id="submit" type="submit">Submit</button>
      <span id="message"></span>
    </div>
  </form>

  <div class="list-head">
    <h2>Tasks from this browser</h2>
    <button class="plain" id="clear" type="button">Clear list</button>
  </div>
  <div class="tasks" id="tasks"></div>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Image preview">
  <figure>
    <button class="close" id="viewer-close" type="button" aria-label="Close">×</button>
    <img id="viewer-img" alt="">
    <figcaption id="viewer-caption"></figcaption>
  </figure>
</div>

<script>
const STORE = "sdg.tasks";
const FINISHED = new Set(["success", "needs_review", "failed", "not_found"]);
const $ = (id) => document.getElementById(id);
let tasks = load();            // [{taskid, prompt, submitted}], newest first
let status = {};               // taskid -> latest API view
let timer = null;

function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(tasks)); } catch { /* private mode: list lasts until reload */ }
}
function newTaskId() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `test-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s ago`;
  return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m ago`;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

async function refreshHealth() {
  const box = $("health");
  try {
    const h = await api("/api/health");
    if ((h.styles || []).join() !== Object.keys(styles).sort().join()) loadStyles();
    const pills = [
      ["status", h.status, h.status !== "ok"],
      ["cluster", h.cluster, h.cluster === "unreachable"],
      ["queued", `${h.queued_tasks} tasks, ${h.queued_images} images`, false],
      ["batches in flight", h.batches_in_flight, false],
      ["last poll", h.last_poll ? new Date(h.last_poll).toLocaleTimeString() : "never", false],
      ["disk free", `${h.disk_free_gb} GB`, false],
    ];
    box.replaceChildren(...pills.map(([k, v, bad]) => {
      const p = el("span", "pill" + (bad ? " bad" : ""), `${k}: `);
      p.append(el("b", null, String(v)));
      return p;
    }));
  } catch (e) {
    box.replaceChildren(el("span", "pill bad", `health: ${e.message}`));
  }
}

let styles = {};           // name -> {trigger, scale, hint}, from /api/styles

async function loadStyles() {
  try {
    const body = await api("/api/styles");
    styles = Object.fromEntries(body.styles.map((st) => [st.name, st]));
  } catch { return; }
  const sel = $("style"), keep = sel.value;
  sel.replaceChildren(sel.options[0], ...Object.keys(styles).map((n) => {
    const o = el("option", null, `${n} (${styles[n].trigger || "no trigger"})`); o.value = n; return o;
  }));
  sel.value = styles[keep] ? keep : "";
  showHint();
}

function showHint() {
  const st = styles[$("style").value];
  $("style-hint").textContent = st
    ? `Trigger "${st.trigger}" is in the prompt (move it if you like; the gateway adds it if missing). ` +
      `Strength ${st.scale}.${st.hint ? " Tip: " + st.hint : ""}`
    : "";
}

// Picking a style swaps its trigger into the prompt, replacing the previous style's.
let lastStyle = "";
function onStyleChange() {
  const box = $("prompt");
  let text = box.value;
  const old = styles[lastStyle]?.trigger;
  if (old) {
    const i = text.toLowerCase().indexOf(old.toLowerCase());
    if (i >= 0) text = (text.slice(0, i) + text.slice(i + old.length)).replace(/^[\s,]+|[\s,]+$/g, "").replace(/,\s*,/g, ",");
  }
  lastStyle = $("style").value;
  const trig = styles[lastStyle]?.trigger;
  if (trig && !text.toLowerCase().includes(trig.toLowerCase())) text = text ? `${trig}, ${text}` : trig;
  box.value = text;
  showHint();
}
$("style").addEventListener("change", onStyleChange);

async function refreshTasks() {
  const pending = tasks.filter((t) => !FINISHED.has(status[t.taskid]?.result)).map((t) => t.taskid);
  for (let i = 0; i < pending.length; i += 100) {
    try {
      const body = await api(`/api/images/tasks?ids=${pending.slice(i, i + 100).map(encodeURIComponent).join(",")}`);
      for (const t of body.tasks) status[t.taskid] = t;
    } catch (e) {
      $("message").textContent = `Status refresh failed: ${e.message}`;
      $("message").className = "err";
    }
  }
  render();
  schedule();
}

function schedule() {
  clearTimeout(timer);
  const active = tasks.some((t) => !FINISHED.has(status[t.taskid]?.result));
  if (active) timer = setTimeout(refreshTasks, 5000);   // stops once every task has finished
}

function render() {
  const list = $("tasks");
  if (!tasks.length) {
    list.replaceChildren(el("p", "empty", "No tasks yet."));
    return;
  }
  list.replaceChildren(...tasks.map((t) => {
    const s = status[t.taskid] || { result: "queued" };
    const card = el("div", "card");
    const top = el("div", "task-top");
    top.append(el("span", "taskid", t.taskid), el("span", `badge b-${s.result}`, s.result.replace("_", " ")));
    if (s.style) top.append(el("span", "badge b-queued", `style: ${s.style}`));
    const meta = el("span", "meta", `submitted ${ago(t.submitted)}` + (s.version > 1 ? ` · version ${s.version}` : ""));
    top.append(meta);
    card.append(top, el("p", "prompt", t.prompt));
    if (s.error) card.append(el("p", "error", s.error));
    if (s.images && s.images.length) {
      const grid = el("div", "thumbs");
      for (const img of s.images) {
        const a = el("a", "thumb");
        a.href = img.url;
        a.addEventListener("click", (ev) => {
          ev.preventDefault();
          openViewer(img.url, `${t.taskid} · candidate ${s.images.indexOf(img) + 1} · ${img.result.replace("_", " ")} · seed ${img.seed}`);
        });
        const i = el("img"); i.src = img.url; i.alt = `${t.taskid} candidate`; i.loading = "lazy";
        a.append(i, el("span", null, `${img.result.replace("_", " ")} · seed ${img.seed}`));
        grid.append(a);
      }
      card.append(grid);
    }
    return card;
  }));
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const msg = $("message");
  const task = {
    taskid: $("taskid").value.trim(),
    prompt: $("prompt").value.trim(),
    negative_prompt: $("negative").value.trim(),
    count: Number($("count").value),
    postprocess: $("postprocess").value,
    on_duplicate: $("dup").value,
  };
  if ($("style").value) task.style = $("style").value;
  if ($("prefix").value.trim()) task.filename_prefix = $("prefix").value.trim();
  $("submit").disabled = true;
  msg.className = ""; msg.textContent = "Submitting…";
  try {
    const body = await api("/api/images/gen", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tasks: [task] }),
    });
    const answer = body.tasks[0];
    if (answer.result === "rejected") {
      msg.className = "err"; msg.textContent = `Rejected: ${answer.error}`;
    } else {
      msg.textContent = answer.replaced ? `Replaced, now version ${answer.version}.` : "Queued.";
      tasks = [{ taskid: task.taskid, prompt: task.prompt, submitted: Date.now() },
               ...tasks.filter((t) => t.taskid !== task.taskid)];
      status[task.taskid] = { result: "queued", version: answer.version };
      save(); render(); refreshTasks();
      $("taskid").value = newTaskId();
    }
  } catch (e) {
    msg.className = "err"; msg.textContent = `Submit failed: ${e.message}`;
  } finally {
    $("submit").disabled = false;
  }
});

function openViewer(url, caption) {
  $("viewer-img").src = url;
  $("viewer-img").alt = caption;
  $("viewer-caption").textContent = caption;
  $("viewer").classList.add("open");
  $("viewer-close").focus();
}
function closeViewer() {
  $("viewer").classList.remove("open");
  $("viewer-img").removeAttribute("src");
}
$("viewer-close").addEventListener("click", closeViewer);
$("viewer").addEventListener("click", (ev) => { if (ev.target === $("viewer")) closeViewer(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeViewer(); });

$("clear").addEventListener("click", () => {
  tasks = []; status = {}; save(); render();
});

$("taskid").value = newTaskId();
loadStyles();
render();
refreshTasks();
refreshHealth();
setInterval(refreshHealth, 15000);
setInterval(render, 10000);  // keeps "submitted … ago" current
</script>
</body>
</html>
