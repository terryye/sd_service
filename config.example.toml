# Copy to config.toml and edit. See DESIGN.md section 9.

[server]
listen = "127.0.0.1:8080"     # a private address on the deploy server
data_dir = "./data"           # SQLite file and result images; back this up

[cluster]
user = "your.username"
login_host = "login.explorer.northeastern.edu"
xfer_host = "xfer.discovery.neu.edu"
ssh_key = ""                  # e.g. "~/.ssh/sd_gateway"; empty uses ssh's default key
remote_dir = "~/sd_service"   # shared container and model live here
env = "dev"                   # "prod" on the server: ~/sd_service/<env>/ and sdg-<env>- job names

[queue]
max_batch_images = 200
max_wait_s = 60
max_attempts = 3
idle_s = 300                  # keep a job warm this long after its batch for the next one; 0 = off
handoff_timeout_s = 90        # take back a hand-off no warm job claimed, and sbatch instead
job_minutes = 90              # Slurm time limit: this plus 15 s per image

[poll]
interval_s = 30
unreachable_after_s = 300

[limits]
max_tasks_per_request = 100
max_ids_per_status = 100
min_disk_free_gb = 10

[downloads]
civitai_token = ""            # Civitai API key; only `deploy` uses it, to download Civitai LoRAs

# LoRA styles. A task picks one with "style": "<name>". `deploy` downloads each file
# once into ~/sd_service/loras/ and checks its SHA-256 (Civitai's model page and
# Hugging Face's file page both show it). Example:
#
# [[styles]]
# name = "vector"              # https://civitai.com/models/60132 (SDXL version)
# source = "civitai:1219697"   # Civitai model version id, or "hf:<owner>/<repo>/<file>.safetensors"
# sha256 = "b0024ab16d212bb1f08ccbc3b25cbe781e3aef8b00f91526778ca1b1a2c61480"
# trigger = "color icon"       # added in front of the prompt unless it already contains it
# scale = 0.8                  # LoRA strength, 0-2
# hint = 'keep prompts short and simple'   # optional, shown on the test page
#
# A Civitai LoRA (source = "civitai:<id>") needs civitai_token above. A LoRA trained
# with pivotal tuning also needs embeddings, embeddings_sha256 and embedding_tokens
# (see DESIGN.md 7.1).
